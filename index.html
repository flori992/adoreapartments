<title>StayFlow — Rental Business Manager</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#68738a;--line:#e7eaf0;--accent:#111827;--accent2:#eef1f6;--good:#16845b;--bad:#c43d4b;--shadow:0 8px 30px rgba(23,32,51,.07);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}.sidebar{width:235px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:20px;font-weight:800;padding:8px 12px 22px}.brand span{color:#7b8496}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:12px 13px;border-radius:12px;color:var(--muted);font-weight:600}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--text)}.main{margin-left:235px;width:calc(100% - 235px);padding:26px 30px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:10px}.btn{padding:11px 15px;border-radius:12px;font-weight:700;background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.stat .value{font-size:26px;font-weight:800;margin-top:8px}.stat .sub{color:var(--muted);margin-top:4px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:17px;margin:0 0 14px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef1f6;font-size:12px;font-weight:700}.badge.good{background:#e7f6ef;color:var(--good)}.badge.bad{background:#fdebed;color:var(--bad)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.input,.select,.textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#9aa4b5}.toolbar .input{max-width:310px}.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:16px}.admin-links{display:grid;gap:8px}.admin-link{display:flex;align-items:center;gap:12px;width:100%;padding:13px;background:#f7f8fa;border:1px solid var(--line);border-radius:12px;text-align:left;color:var(--text)}.admin-link>span{font-size:20px}.admin-link div{flex:1}.admin-link small{display:block;color:var(--muted);margin-top:2px}.admin-link strong{font-size:22px;color:var(--muted)}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{background:#f1f3f7;width:34px;height:34px;border-radius:10px}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.empty{padding:30px;text-align:center;color:var(--muted)}.property-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.prop-card{min-height:145px;position:relative}.prop-card h3{margin:0 0 6px}.prop-card p{margin:4px 0;color:var(--muted)}.iconbtn{background:#f1f3f7;border-radius:9px;padding:7px 9px}.prop-actions{position:absolute;right:14px;top:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cal-head,.cal-day{background:#fff;padding:10px;min-height:80px}.cal-head{min-height:auto;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}.cal-day .date{font-weight:800}.event{font-size:10px;margin-top:5px;padding:4px 5px;border-radius:6px;background:#eef1f6;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.event.in{background:#e7f6ef}.event.out{background:#fdebed}.bottom{display:none}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.summary .mini{background:#f7f8fa;border-radius:12px;padding:12px}.mini strong{display:block;font-size:18px}.muted{color:var(--muted)}.positive{color:var(--good)}.negative{color:var(--bad)}@media(max-width:900px){.sidebar{display:none}.main{margin:0;width:100%;padding:18px 14px 90px}.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.bottom button{background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:6px 2px}.bottom button.active{color:var(--text)}.bottom b{display:block;font-size:17px;margin-bottom:2px}.top{align-items:flex-start}.actions .secondary{display:none}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:repeat(2,1fr)}.input,.select,.textarea{font-size:16px}.filters .field{min-width:0}.admin-link{min-height:58px}.modal{padding:12px}.modalbox{width:100%;max-height:calc(100vh - 24px);padding:16px}}
.loginbox{width:min(430px,100%)}

.timeline-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;scroll-behavior:smooth;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.timeline-table{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%}
.timeline-table th,.timeline-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;text-align:center;min-width:88px;height:54px}
.timeline-table th{position:sticky;top:0;background:#fff;z-index:2;font-size:12px;color:var(--muted);font-weight:800}
.timeline-table th:first-child,.timeline-table td:first-child{position:sticky;left:0;z-index:3;background:#fff;text-align:left;min-width:180px;font-weight:800}
.timeline-table thead th:first-child{z-index:4}
.timeline-table tr:last-child td{border-bottom:0}
.timeline-table th:last-child,.timeline-table td:last-child{border-right:0}
.timeline-cell{position:relative}
.property-name-short{display:none}
.timeline-today{background:#f2f6ff!important;box-shadow:inset 2px 0 0 #5b78d1,inset -2px 0 0 #5b78d1}
.timeline-table th.timeline-today{color:#3455b2;scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-left:180px}
.today-label{display:block;font-size:9px;line-height:1;margin-top:3px;text-transform:uppercase;letter-spacing:.06em;color:#5b78d1}
.stay-chip{display:block;padding:6px 7px;border-radius:8px;background:#eef1f6;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}
@media(max-width:900px){.timeline-table th,.timeline-table td{min-width:82px;padding:8px}.timeline-table th:first-child,.timeline-table td:first-child{min-width:54px;width:54px;max-width:54px;padding:8px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.property-name-full{display:none}.property-name-short{display:inline}.timeline-table th.timeline-today{scroll-margin-left:54px}}


.user-list{display:grid;gap:12px}
.user-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.user-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.user-head h3{margin:0;font-size:15px}.user-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.user-role{padding:5px 8px;border-radius:999px;background:#eef1f6;font-size:11px;font-weight:800;text-transform:uppercase}
.permission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.perm-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#f9fafb;font-size:12px;font-weight:700}
.perm-toggle input{width:18px;height:18px}
.user-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.danger{background:#fff;color:var(--bad);border:1px solid #f1c8cd}
@media(max-width:900px){.permission-grid{grid-template-columns:1fr}.user-head{align-items:flex-start}.user-actions .btn{flex:1}}


.sync-box{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f9fafb}
.sync-url{display:flex;gap:8px;align-items:center}.sync-url input{flex:1}
.sync-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sync-status{margin-top:8px;font-size:12px;color:var(--muted)}
@media(max-width:900px){.sync-url{flex-direction:column;align-items:stretch}.sync-actions .btn{flex:1}}

</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">StayFlow <span>Manager</span></div><nav class="nav" id="sideNav"></nav></aside>
<main class="main"><div id="view"></div></main>
</div>
<nav class="bottom" id="bottomNav"></nav>

<div class="modal" id="loginModal"><div class="modalbox loginbox">
  <div class="modalhead"><div><h2 style="margin:0">Adore Apartments</h2><p class="muted" style="margin:4px 0 0">Sign in to your management app</p></div></div>
  <div id="loginMessage" class="muted" style="margin-bottom:12px"></div>
  <div class="field" style="margin-bottom:12px"><label>Email</label><input id="loginEmail" type="email" class="input" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="loginPassword" type="password" class="input" autocomplete="current-password"></div>
  <div class="modalfoot"><button class="btn" onclick="signIn()">Sign in</button></div>
</div></div>

<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mrukzyqaztgkdgbqshzk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LKhOWsC-QPjRJWUGjK29Og__85phuyW';
const CLOUD_ENABLED = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
const supabaseClient = CLOUD_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let currentUser = null;
let currentProfile = null;
let permissions = {};
const KEY='stayflow-v1';
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>{
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 properties:[{id:'P-001',name:'Property 01',address:'',active:true},{id:'P-002',name:'Property 02',address:'',active:true}],
 reservations:[],
 expenses:[],
 externalEvents:[],
 settings:{businessName:'StayFlow Manager',currency:'GBP'}
};
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}
function nextReservationId(){
  const used=new Set(state.reservations.map(r=>String(r.id)));
  for(let n=1;n<=9999;n++){if(!used.has(String(n)))return String(n)}
  return Math.random().toString(36).slice(2,6).toUpperCase();
}
let changedIds=false;
state.reservations.forEach(r=>{if(!/^[A-Za-z0-9]{1,4}$/.test(String(r.id))){r.id=nextReservationId();changedIds=true;}});
if(changedIds)save();
function propName(id){return state.properties.find(p=>p.id===id)?.name||'—'}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dateFmt(s){if(!s)return '—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function nights(r){return Math.max(0,Math.round((new Date(r.checkout)-new Date(r.checkin))/86400000))}
function currentReservations(){return state.reservations.filter(r=>r.checkin<=iso(today)&&r.checkout>iso(today))}
function navItems(){return [['dashboard','⌂','Dashboard'],['reservations','▣','Reservations'],['today','◷','Today'],['expenses','£','Expenses'],['settings','⚙','Settings'],['properties','⌂','Properties'],['calendar','□','Calendar'],['reports','▤','Reports']]}

async function loadCloudState(){
  if(!CLOUD_ENABLED) return;
  const [pRes,rRes,eRes,xRes,sRes] = await Promise.all([
    supabaseClient.from('properties').select('*').order('name'),
    supabaseClient.from('reservations').select('*').order('check_in'),
    supabaseClient.from('expenses').select('*').order('date',{ascending:false}),
    supabaseClient.from('external_calendar_events').select('*').order('start_date'),
    supabaseClient.from('app_settings').select('*').limit(1).maybeSingle()
  ]);
  if(pRes.error||rRes.error||eRes.error||xRes.error){ throw (pRes.error||rRes.error||eRes.error||xRes.error); }
  state.properties=(pRes.data||[]).map(p=>({id:p.id,name:p.name,address:p.address||'',active:p.active,bookingIcalUrl:p.booking_ical_url||'',exportToken:p.export_token||''}));
  state.reservations=(rRes.data||[]).map(r=>({
    id:r.id,guestName:r.guest_name,propertyId:r.property_id,platform:r.platform,checkin:r.check_in,
    checkout:r.check_out,totalPrice:Number(r.total_price||0),paymentStatus:r.payment_status,paymentMethod:r.payment_method||'Card',phone:r.phone||'',notes:r.notes||''
  }));
  state.externalEvents=(xRes.data||[]).map(x=>({id:x.id,propertyId:x.property_id,start:x.start_date,end:x.end_date,summary:x.summary||'Booking.com',source:x.source||'Booking.com'}));
  state.expenses=(eRes.data||[]).map(e=>({
    id:e.id,date:e.date,category:e.category,description:e.description,amount:Number(e.amount||0),
    propertyId:e.property_id||'',paidBy:e.paid_by||'',paymentMethod:e.payment_method,listing:e.listing,receipt:e.receipt_path||''
  }));
  if(sRes.data) state.settings={businessName:sRes.data.business_name||'Adore Apartments',currency:sRes.data.currency||'GBP'};
  localStorage.setItem(KEY,JSON.stringify(state));
}
async function loadIdentity(){
  if(!CLOUD_ENABLED) return true;
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){ showLogin(); return false; }
  currentUser=session.user;
  const {data:profile,error}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single();
  if(error){ console.error(error); alert('Your account is not configured yet. Ask the admin to create your profile.'); await supabaseClient.auth.signOut(); showLogin(); return false; }
  currentProfile=profile;
  const {data:perms}=await supabaseClient.from('user_permissions').select('*').eq('user_id',currentUser.id).maybeSingle();
  permissions=perms||{};
  return true;
}
function showLogin(){document.getElementById('loginModal').classList.add('show');document.getElementById('modal').classList.remove('show')}
function hideLogin(){document.getElementById('loginModal').classList.remove('show')}
async function signIn(){
  loginMessage.textContent='Signing in…';
  const {error}=await supabaseClient.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});
  if(error){loginMessage.textContent=error.message;return}
  const ok=await loadIdentity();
  if(ok){hideLogin(); await loadCloudState(); startRealtime(); renderNav(); render();}
}
async function signOut(){if(CLOUD_ENABLED) await supabaseClient.auth.signOut(); location.reload()}
let realtimeChannel=null;
function startRealtime(){
  if(!CLOUD_ENABLED||!currentUser)return;
  if(realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel=supabaseClient.channel('adore-apartments-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'reservations'},async()=>{await loadCloudState();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'expenses'},async()=>{await loadCloudState();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'properties'},async()=>{await loadCloudState();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'external_calendar_events'},async()=>{await loadCloudState();render();})
    .subscribe();
}
function can(permission){return !CLOUD_ENABLED || currentProfile?.role==='admin' || permissions[permission]===true}
function requirePermission(permission){if(can(permission))return true;alert('You do not have permission to do this.');return false}
async function cloudSyncAll(){
  if(!CLOUD_ENABLED||!currentUser)return;
  // Upsert current client state. RLS still decides whether the operation is allowed.
  if(state.properties.length) await supabaseClient.from('properties').upsert(state.properties.map(p=>({id:p.id,name:p.name,address:p.address,active:p.active})));
  if(state.reservations.length) await supabaseClient.from('reservations').upsert(state.reservations.map(r=>({
    id:r.id,guest_name:r.guestName,property_id:r.propertyId,platform:r.platform,check_in:r.checkin,check_out:r.checkout,
    total_price:r.totalPrice,payment_status:r.paymentStatus,payment_method:r.paymentMethod||'Card',phone:r.phone,notes:r.notes,updated_by:currentUser.id
  })));
  if(state.expenses.length) await supabaseClient.from('expenses').upsert(state.expenses.map(e=>({
    id:e.id,date:e.date,category:e.category,description:e.description,amount:e.amount,property_id:e.propertyId||null,
    paid_by:e.paidBy,payment_method:e.paymentMethod,listing:e.listing,receipt_path:e.receipt||null,updated_by:currentUser.id
  })));
}

function renderNav(){let html=navItems().map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b> ${x[2]}</button>`).join('');sideNav.innerHTML=html;bottomNav.innerHTML=navItems().slice(0,5).map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
let page='dashboard';
function go(p){page=p;renderNav();render()}
function render(){({dashboard:dashboard,reservations:reservations,today:todayPage,expenses:expenses,properties:properties,calendar:calendar,reports:reports,settings:settings}[page]||dashboard)()}
function shell(title,sub,buttons=''){view.innerHTML=`<div class="top"><div class="title"><h1>${title}</h1><p>${sub||''}</p></div><div class="actions">${buttons}</div></div>`}
function addButtons(){return `<button class="btn" onclick="reservationModal()">+ Add Reservation</button><button class="btn secondary" onclick="expenseModal()">+ Add Expense</button>`}
function dashboard(){
 const ym=iso(today).slice(0,7), rs=state.reservations.filter(r=>r.checkin.startsWith(ym)), es=state.expenses.filter(e=>e.date.startsWith(ym));
 const rev=rs.reduce((a,r)=>a+Number(r.totalPrice||0),0), ex=es.reduce((a,e)=>a+Number(e.amount||0),0), occ=currentReservations();
 shell('Dashboard',CLOUD_ENABLED&&currentUser?'Cloud connected · reservations save directly to Supabase':'Your rental business at a glance',addButtons());
 view.innerHTML+=`<div class="grid stats">
 ${stat('Reservations',rs.length,'this month')}${stat('Revenue',money(rev),'this month')}${stat('Expenses',money(ex),'this month')}${stat('Profit',money(rev-ex),'revenue − expenses')}
 </div><div class="grid two">
 <section class="card"><div class="section-head"><h2>Tomorrow's check-ins</h2><button class="iconbtn" onclick="go('reservations')">View all</button></div>${upcoming('checkin')}</section>
 <section class="card"><div class="section-head"><h2>Tomorrow's check-outs</h2><button class="iconbtn" onclick="go('today')">View</button></div>${upcoming('checkout')}</section>
 </div><div class="grid three" style="margin-top:16px">
 <section class="card"><h2>Current occupied properties</h2><div class="stat"><div class="value">${occ.length}</div><div class="sub">active stays today</div></div></section>
 <section class="card"><h2>Current guests</h2><div class="stat"><div class="value">${occ.length}</div><div class="sub">${occ.slice(0,3).map(r=>esc(r.guestName)).join(', ')||'None'}</div></div></section>
 <section class="card"><h2>Quick actions</h2><div class="actions"><button class="btn" onclick="reservationModal()">Add Reservation</button><button class="btn secondary" onclick="expenseModal()">Add Expense</button></div></section>
 </div><section class="card" style="margin-top:16px"><div class="section-head"><h2>Calendar</h2><button class="iconbtn" onclick="go('calendar')">Open calendar</button></div>${miniCalendar()}</section>`;
}
function stat(l,v,s){return `<section class="card stat"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></section>`}
function upcoming(type){
  const target=tomorrowDate();
  let arr=state.reservations
    .filter(r=>r[type]===target)
    .sort((a,b)=>a.guestName.localeCompare(b.guestName));
  if(!arr.length)return `<div class="empty">No ${type==='checkin'?'check-ins':'check-outs'} tomorrow.</div>`;

function propertyTimelineCalendar(pastDays=0,futureDays=13,wrapId=''){
  const dates=[];
  for(let i=-pastDays;i<=futureDays;i++){
    let d=new Date(today);
    d.setDate(d.getDate()+i);
    dates.push({iso:iso(d),label:d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}),isToday:i===0});
  }
  let head=`<thead><tr><th><span class="property-name-full">Properties</span><span class="property-name-short">Unit</span></th>${dates.map(d=>`<th class="${d.isToday?'timeline-today':''}" ${d.isToday?'data-today="true"':''}>${d.label}${d.isToday?'<span class="today-label">Today</span>':''}</th>`).join('')}</tr></thead>`;
  let body=state.properties.filter(p=>p.active!==false).map(p=>{
    let cells=dates.map(d=>{
      let r=state.reservations.find(r=>r.propertyId===p.id && r.checkin<=d.iso && r.checkout>d.iso);
      if(r) return `<td class="timeline-cell ${d.isToday?'timeline-today':''}"><span class="stay-chip" title="${esc(r.guestName)} · ${esc(r.platform)}">${esc(r.guestName)}</span></td>`;
      let x=(state.externalEvents||[]).find(x=>x.propertyId===p.id && x.start<=d.iso && x.end>d.iso);
      if(x) return `<td class="timeline-cell ${d.isToday?'timeline-today':''}"><span class="stay-chip" title="${esc(x.summary)}">${esc(x.summary||'Booking.com')}</span></td>`;
      return `<td class="timeline-cell ${d.isToday?'timeline-today':''}"></td>`;
    }).join('');
    return `<tr><td title="${esc(p.name)}"><span class="property-name-full">${esc(p.name)}</span><span class="property-name-short">${esc(shortPropertyName(p.name))}</span></td>${cells}</tr>`;
  }).join('');
  if(!body) body=`<tr><td colspan="${dates.length+1}" class="empty">No properties added.</td></tr>`;
  return `<div class="timeline-wrap" ${wrapId?`id="${wrapId}"`:''}><table class="timeline-table">${head}<tbody>${body}</tbody></table></div>
  <div class="timeline-legend"><span>Grey = occupied reservation</span><span>Checkout day is not counted as occupied</span></div>`;
}

function initTimelineDetent(wrapId){
  const wrap=document.getElementById(wrapId);
  const todayHead=wrap?.querySelector('[data-today="true"]');
  const propertyHead=wrap?.querySelector('thead th:first-child');
  if(!wrap||!todayHead||!propertyHead)return;
  const todayPosition=()=>Math.max(0,todayHead.offsetLeft-propertyHead.offsetWidth);
  wrap.scrollTo({left:todayPosition(),behavior:'auto'});
  let timer=null,detentReady=false;
  const settleOnToday=()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{
      const distance=Math.abs(wrap.scrollLeft-todayPosition());
      if(distance<=42){
        wrap.scrollTo({left:todayPosition(),behavior:'smooth'});
        if(detentReady&&navigator.vibrate)navigator.vibrate(8);
        detentReady=false;
      }else detentReady=true;
    },90);
  };
  wrap.addEventListener('scroll',settleOnToday,{passive:true});
}

async function callUserAdmin(action,payload={}){
  if(!CLOUD_ENABLED) throw new Error('Cloud mode is not enabled.');
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session) throw new Error('Your session has expired. Please sign in again.');
  const res=await fetch(`${SUPABASE_URL}/functions/v1/user-admin`,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${session.access_token}`,
      'apikey':SUPABASE_ANON_KEY
    },
    body:JSON.stringify({action,...payload})
  });
  let body={};
  try{body=await res.json()}catch(_){}
  if(!res.ok) throw new Error(body.error||`User management request failed (${res.status})`);
  return body;
}

  </div>
  <div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="createAppUser()">Create User</button></div>`;
  modal.classList.add('show');
}

async function createAppUser(){
  const email=newUserEmail.value.trim();
  const password=newUserPassword.value;
  const full_name=newUserName.value.trim();
  const role=newUserRole.value;
  if(!email||!password){alert('Email and password are required.');return}
  if(password.length<8){alert('Use a password with at least 8 characters.');return}
  try{
    await callUserAdmin('create',{email,password,full_name,role});
    closeModal();
    alert('User created.');
    await loadAdminUsers();
  }catch(e){alert(e.message)}
}

async function removeUser(userId,email){
  if(userId===currentUser?.id){alert('You cannot remove the account you are currently signed in with.');return}
  if(!confirm(`Remove ${email||'this user'}? Their reservations and expenses will remain in the business database.`))return;
  try{
    await callUserAdmin('delete',{user_id:userId});
    alert('User removed.');
    await loadAdminUsers();
  }catch(e){alert(e.message)}
}

async function saveReservation(id){
  const r={
    id:id||nextReservationId(),
    guestName:rGuest.value.trim(),
    propertyId:rProp.value,
    platform:rPlatform.value,
    checkin:rIn.value,
    checkout:rOut.value,
    totalPrice:Number(rPrice.value)||0,
    paymentStatus:rPay.value,
    paymentMethod:rPaymentMethod.value,
    phone:rPhone.value.trim(),
    notes:rNotes.value.trim()
  };
  if(!r.guestName||!r.checkin||!r.checkout){alert('Please add guest name and dates.');return}
  if(r.checkout<=r.checkin){alert('Check-out must be after check-in.');return}

  if(CLOUD_ENABLED && currentUser){
    const row={
      id:r.id,
      guest_name:r.guestName,
      property_id:r.propertyId,
      platform:r.platform,
      check_in:r.checkin,
      check_out:r.checkout,
      total_price:r.totalPrice,
      payment_status:r.paymentStatus,
      payment_method:r.paymentMethod||'Card',
      phone:r.phone,
      notes:r.notes,
      updated_by:currentUser.id,
      updated_at:new Date().toISOString()
    };
    let result;
    if(id){
      result=await supabaseClient.from('reservations').update(row).eq('id',id).select().single();
    }else{
      row.created_by=currentUser.id;
      result=await supabaseClient.from('reservations').insert(row).select().single();
    }
    if(result.error){
      alert('Could not save reservation to the cloud: '+result.error.message);
      return;
    }
  }

  const i=state.reservations.findIndex(x=>x.id===r.id);
  i>=0?state.reservations[i]=r:state.reservations.push(r);
  save();
  closeModal();
  render();
}

  render();
}

function propertyModal(id=''){ if(!requirePermission(id?'properties_edit':'properties_add')) return;let p=state.properties.find(x=>x.id===id)||{id:uid('P'),name:'',address:'',active:true};modalTitle.textContent=id?'Edit Property':'Add Property';modalBody.innerHTML=`<div class="formgrid"><div class="field"><label>Property ID</label><input class="input" value="${esc(p.id)}" disabled></div><div class="field"><label>Property Name</label><input id="pName" class="input" value="${esc(p.name)}"></div><div class="field full"><label>Address / Notes</label><textarea id="pAddress" class="textarea" rows="3">${esc(p.address)}</textarea></div><div class="field"><label>Status</label><select id="pActive" class="select"><option value="1" ${p.active?'selected':''}>Active</option><option value="0" ${!p.active?'selected':''}>Inactive</option></select></div></div><div class="modalfoot">${id?`<button class="btn secondary" onclick="deleteProperty('${id}')">Delete</button>`:''}<button class="btn" onclick="saveProperty('${id}')">Save Property</button></div>`;modal.classList.add('show')}
async function saveProperty(id){
  const existing=state.properties.find(x=>x.id===id);
  const p={
    id:id||uid('P'),
    name:pName.value.trim(),
    address:pAddress.value.trim(),
    active:pActive.value==='1',
    bookingIcalUrl:existing?.bookingIcalUrl||'',
    exportToken:existing?.exportToken||''
  };
  if(!p.name){alert('Add a property name.');return}

  if(CLOUD_ENABLED && currentUser){
    const row={id:p.id,name:p.name,address:p.address,active:p.active,updated_by:currentUser.id,updated_at:new Date().toISOString()};
    let result;
    if(id){
      result=await supabaseClient.from('properties').update(row).eq('id',id).select().single();
    }else{
      row.created_by=currentUser.id;
      result=await supabaseClient.from('properties').insert(row).select().single();
    }
    if(result.error){alert('Could not save property to the cloud: '+result.error.message);return}
    if(result.data){
      p.bookingIcalUrl=result.data.booking_ical_url||'';
      p.exportToken=result.data.export_token||'';
    }
  }

  const i=state.properties.findIndex(x=>x.id===p.id);
  i>=0?state.properties[i]=p:state.properties.push(p);
  save();
  closeModal();
  render();
}
async function deleteProperty(id){
  if(!requirePermission('properties_delete')) return;
  if(state.reservations.some(r=>r.propertyId===id)){
    alert('This property has reservations. Reassign or remove them first.');
    return;
  }
  if(!confirm('Delete this property?')) return;

  if(CLOUD_ENABLED && currentUser){
    const {error}=await supabaseClient.from('properties').delete().eq('id',id);
    if(error){
      alert('Could not delete property: '+error.message);
      return;
    }
  }

  state.properties=state.properties.filter(p=>p.id!==id);
  localStorage.setItem(KEY,JSON.stringify(state));
  closeModal();
  render();
}
